<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>homepage</title>
    <link rel="stylesheet" href="../style.css">
    <link rel="stylesheet" href="../tablet.css">
    <link rel="stylesheet" href="../mobile.css"> 
     <script src="https://kit.fontawesome.com/23f8d4ab18.js" crossorigin="anonymous"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair:ital,opsz,wght@0,5..1200,300..900;1,5..1200,300..900&family=Work+Sans:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
</head>

<body class="nda">
    <div class="nda-box">
        <img src="../asset/img/LockKey.svg" alt="logkey">
        <p style="color: var(--font-blue);">This project is under NDA. Please contact me for access.</p>
        <div class="input-box">
            <input type="password" placeholder="Password" id="passwordInput">
            <button onclick="checkPassword()">Submit</button>
        </div>
        <p id="errorMessage" style="color: var(--font-lightblue);"></p>
        <a href="../index.html">Back to homepage &rarr;</a>
    </div>
    
    <script src="../animate.js"></script>
    <script>
    // Get ?project=name from the URL
    const params = new URLSearchParams(window.location.search);
    const project = params.get("project");

    // Map project name to file
    const projectPages = {
      "Fanciti": "../work/fanciti.html",
      "FintrackPro": "../work/FintrackPro.html",
      "PrimeMunchies": "../work/prime_munchie.html"
    };

    function checkPassword() {
      const input = document.getElementById("passwordInput").value;
      const errorMsg = document.getElementById("errorMessage");

      const correctPassword = "ThIssIA$ecRe1"; // PASSWORD IS HERE

      if (input === correctPassword) {
        // Redirect to the correct project
        const nextPage = projectPages[project];
        if (nextPage) {
          window.location.href = nextPage;
        } else {
          errorMsg.textContent = "Project not found.";
        }
      } else {
        errorMsg.textContent = "Wrong password. Please try again.";
      }
    }
    </script>
</body>
</html>
